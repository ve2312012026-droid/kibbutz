<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1c2430; --muted:#6b7280;
  --purple:#311256; --purple2:#3d1a6e; --gold:#c9a04a; --cyan:#00b4d8;
  --line:#e6e8ee; --danger:#c0392b; --ok:#0f9d58; --shadow:0 8px 24px rgba(28,20,60,.08);
  --navh:64px; --topbar:#fff; --iconbg:#f2f3f7; --tabbg:#e9ebf0; --warnbg:#fff6e8; --warnink:#8a5a00;
  --okbg:#eefaf3; --okink:#0b7a43; --kpibg:#f7f5ff; --drawerbg:#fff; --drawerbtn:#f6f7fb;
}
[data-theme="dark"]{
  --bg:#12101a; --card:#1c1828; --ink:#eef0f5; --muted:#9aa0b0;
  --line:#2e2a3d; --shadow:0 8px 24px rgba(0,0,0,.35);
  --topbar:#1a1626; --iconbg:#2a2538; --tabbg:#2a2538; --warnbg:#3d2e12; --warnink:#f0c674;
  --okbg:#143528; --okink:#7ddea0; --kpibg:#241e38; --drawerbg:#1a1626; --drawerbtn:#2a2538;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100%;min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--topbar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:var(--iconbg);color:var(--ink);flex-shrink:0}
.brandmini{width:32px;height:32px;border-radius:8px;object-fit:cover;background:var(--purple);flex-shrink:0}
.top-title{font-weight:800;letter-spacing:.04em;font-size:15px;line-height:1.15}
.top-sub{font-size:11px;color:var(--muted);line-height:1.2;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pills{margin-left:auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end;flex-shrink:0}
.pill{font-size:11px;border-radius:999px;padding:2px 9px;background:#e8f7fb;color:#087a96}
[data-theme="dark"] .pill{background:#1a3340;color:#7dd3e8}
.pill.role{background:#efe7ff;color:#3b237c}
[data-theme="dark"] .pill.role{background:#2d2450;color:#c4b5fd}
.screen{flex:1;padding:14px 14px calc(var(--navh) + 18px + env(safe-area-inset-bottom,0px))}
.hidden{display:none !important}

.home{min-height:calc(100dvh - 70px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--purple);margin:-14px -14px calc(var(--navh) * -1);padding:24px;padding-bottom:calc(24px + var(--navh));gap:28px}
.home img{width:min(88vw,380px);max-height:min(62vh,420px);height:auto;display:block;object-fit:contain}
.home .fallback{text-align:center;color:#fff}
.home .fallback h1{font-size:48px;margin:8px 0 0;letter-spacing:.08em}
.home .fallback p{color:var(--gold);letter-spacing:.28em;margin:6px 0 0}
.home .welcome-btn{border:0;border-radius:999px;padding:14px 36px;background:var(--gold);color:#2a2108;font-weight:800;font-size:16px;letter-spacing:.04em;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.home .welcome-btn:active{transform:scale(.97)}

.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--drawerbg);z-index:41;padding:18px 14px;overflow:auto;box-shadow:8px 0 30px rgba(0,0,0,.25);color:var(--ink)}
.drawer h3{margin:8px 8px 14px}
.drawer button{display:block;width:100%;text-align:left;border:0;background:var(--drawerbtn);border-radius:12px;padding:12px 12px;margin:0 0 8px;color:var(--ink)}
.drawer button.active{background:#efe7ff;color:var(--purple)}
[data-theme="dark"] .drawer button.active{background:#2d2450;color:#c4b5fd}

.bottomnav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--topbar);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;z-index:30}
.bottomnav.bottomnav-2{grid-template-columns:1fr 1fr}
.bottomnav button{border:0;background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bottomnav button.on{color:var(--purple);font-weight:700}
[data-theme="dark"] .bottomnav button.on{color:#c4b5fd}
.bottomnav svg{width:22px;height:22px}

.cartbar{position:fixed;left:14px;right:14px;bottom:calc(var(--navh) + 10px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.cartbar .price{font-size:16px}
[data-theme="dark"] .cartbar{background:var(--card)}
.staff-cartbar{bottom:calc(14px + env(safe-area-inset-bottom,0px))}

h2{margin:4px 0 12px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:13px}
.price{color:var(--cyan);font-weight:800}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--purple);color:#fff}
.btn.gold{background:var(--gold);color:#2a2108}
.btn.ghost{background:var(--iconbg);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink)}
.cats{display:flex;flex-direction:column;gap:8px}
.catbtn{text-align:left;border:0;background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);font-weight:700;color:var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:#2c3440;color:#fff;font-size:20px}
[data-theme="dark"] .plus{background:#4a4558}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.tabs button{border:0;background:var(--tabbg);border-radius:999px;padding:8px 12px;white-space:nowrap;color:var(--ink)}
.tabs button.on{background:var(--purple);color:#fff}
.listbtn{width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;color:var(--ink)}
.swipe-wrap{position:relative;margin-bottom:10px;border-radius:16px;overflow:hidden}
.swipe-actions{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:space-between;z-index:0;pointer-events:none}
.swipe-actions .act{pointer-events:auto;border:0;min-width:92px;padding:0 18px;font-weight:700;font-size:13px;letter-spacing:.02em;color:#fff;
  backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  transition:opacity .25s ease, transform .25s cubic-bezier(.2,.8,.2,1)}
.swipe-actions .act-del{background:linear-gradient(135deg,rgba(192,57,43,.88),rgba(231,76,60,.72));margin-left:auto}
.swipe-actions .act-edit{background:linear-gradient(135deg,rgba(0,180,216,.9),rgba(0,150,199,.75))}
.swipe-panel{position:relative;z-index:1;background:var(--card);border-radius:16px;box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.22,1,.36,1);touch-action:pan-y;padding:12px 14px;will-change:transform}
.swipe-wrap.open-left .swipe-panel{transform:translateX(-92px)}
.swipe-wrap.open-right .swipe-panel{transform:translateX(92px)}
.modal-back .modal{transition:transform .4s cubic-bezier(.22,1,.36,1);touch-action:none}
.modal-back.drag-down .modal{transition:none}
.modal-back.closing .modal{transform:translateY(110%)}
.badge{font-size:11px;border-radius:999px;padding:2px 8px;background:#eef6ff;color:var(--ink)}
[data-theme="dark"] .badge{background:#1a3340;color:#7dd3e8}
.modal-back{position:fixed;inset:0;background:rgba(17,12,32,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);color:var(--ink);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.modal.wide{border-radius:12px;margin:12px;width:min(820px,calc(100% - 24px))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--kpibg);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:18px}
.warn{background:var(--warnbg);color:var(--warnink);border-radius:12px;padding:10px;margin-bottom:10px}
.okbox{background:var(--okbg);color:var(--okink);border-radius:12px;padding:10px;margin-bottom:10px}

.invoice{background:#fff;color:#111;border:1px solid #d9d9d9;padding:16px;font-size:12px}
.invoice header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.invoice h1{font-size:13px;margin:0;letter-spacing:.04em}
.invoice table{width:100%;border-collapse:collapse;margin-top:10px}
.invoice th{background:#1f4e79;color:#fff;font-weight:600;padding:5px;font-size:10px}
.invoice td{border-bottom:1px solid #e5e5e5;padding:4px;vertical-align:top}
.invoice .box{border:1px solid #ccc;border-radius:6px;padding:8px;flex:1}
.invoice .tot{margin-left:auto;width:260px}
.invoice .tot td{border:1px solid #ddd}
.ticket{font-family:ui-monospace,monospace;background:#fff;padding:12px;width:280px;margin:0 auto;font-size:12px}
.ticket h3{text-align:center;margin:4px 0}
@media print{
  body *{visibility:hidden}
  #printRoot,#printRoot *{visibility:visible}
  #printRoot{position:absolute;left:0;top:0;width:100%}
  .no-print{display:none !important}
}
</style>

<body>
<div class="app" id="app"></div>
<div id="printRoot" class="hidden"></div>

<script>
/* Firebase Realtime Database — ya configurado */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCAEEtimVy6r0ZAZgCSYEZngbhx2ydWNkc",
  authDomain: "kibbutz-78a5d.firebaseapp.com",
  databaseURL: "https://kibbutz-78a5d-default-rtdb.firebaseio.com",
  projectId: "kibbutz-78a5d",
  storageBucket: "kibbutz-78a5d.firebasestorage.app",
  messagingSenderId: "587833331807",
  appId: "1:587833331807:web:e1a356bfea80d7ac534bea",
  measurementId: "G-NNLMX56E9E"
};

const KEY="kibutz_pos_v3";
const STAFF_MODE_KEY="kibutz_staff_device";
function _getCookieEarly(name){
  try{
    const m=document.cookie.match(new RegExp("(?:^|; )"+name+"=([^;]*)"));
    return m?decodeURIComponent(m[1]):null;
  }catch(e){ return null; }
}
(function(){
  try{
    if(new URLSearchParams(window.location.search).has("admin")){
      localStorage.setItem(STAFF_MODE_KEY,"1");
      document.cookie=STAFF_MODE_KEY+"=1;max-age="+(400*86400)+";path=/;SameSite=Lax";
    }
    // Si hay sesión de dueño/admin guardada, marcar dispositivo staff
    const role=localStorage.getItem("kibutz_session_role")||_getCookieEarly("kibutz_session_role");
    if(role==="dueno"||role==="admin"){
      localStorage.setItem(STAFF_MODE_KEY,"1");
      document.cookie=STAFF_MODE_KEY+"=1;max-age="+(400*86400)+";path=/;SameSite=Lax";
    }
  }catch(e){}
})();
const isStaffMode = (function(){
  try{
    if(new URLSearchParams(window.location.search).has("admin")) return true;
    if(localStorage.getItem(STAFF_MODE_KEY)==="1") return true;
    if(_getCookieEarly(STAFF_MODE_KEY)==="1") return true;
    const role=localStorage.getItem("kibutz_session_role")||_getCookieEarly("kibutz_session_role");
    if(role==="dueno"||role==="admin") return true;
  }catch(e){}
  return false;
})();
const $ = (s,r=document)=>r.querySelector(s);
const money = n => "$"+(Number(n)||0).toFixed(2);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDT = d => d ? new Date(d).toLocaleString("es-SV",{dateStyle:"short",timeStyle:"short"}) : "—";
const UNITS=["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE"];
function enLetras(n){
  const v=Math.round(Number(n)*100)/100;
  const ent=Math.floor(v), dec=Math.round((v-ent)*100);
  const w = ent<=20 ? (UNITS[ent]||String(ent)) : String(ent);
  return `${w} DÓLARES CON ${String(dec).padStart(2,"0")}/100`;
}

const cloudEnabled = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
let rtdb = null;
if(cloudEnabled && typeof firebase !== "undefined"){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    rtdb = firebase.database();
  }catch(e){ console.warn("Firebase init", e); }
}

const seed = () => ({
  pins:{dueno:"TaberKibbutzAdmin2026", admin:"KibbutzTaber2026"},
  adminApproved: false,
  pendingAdmin: false,
  emitter:{
    nombre:"KIBUTZ CAFETERÍA",
    nit:"", nrc:"",
    actividad:"Servicio de cafetería y alimentos",
    direccion:"San Salvador, El Salvador",
    telefono:"", correo:""
  },
  mesas:8,
  categories:["Bebidas","Pupusas","Desayunos","Golosinas"],
  products:[
    {id:"p1",cat:"Bebidas",name:"Fresco Natural",price:1,available:true},
    {id:"p2",cat:"Bebidas",name:"Café",price:1.25,available:true},
    {id:"p3",cat:"Bebidas",name:"Té",price:1,available:true},
    {id:"p4",cat:"Bebidas",name:"Chocolate en polvo",price:1.5,available:true},
    {id:"p5",cat:"Bebidas",name:"Agua embotellada",price:0.75,available:true},
    {id:"p6",cat:"Bebidas",name:"Refresco",price:1,available:true}
  ],
  orders:[],
  sessions:[],
  openSession:null,
  seq:1
});

let db = loadLocal();
function loadLocal(){
  try{ const x=JSON.parse(localStorage.getItem(KEY)); if(x&&x.products) return Object.assign(seed(), x); }catch(e){}
  return seed();
}
function saveLocal(){
  const copy = Object.assign({}, db);
  if(rtdb){ copy.orders=[]; copy.openSession=null; }
  localStorage.setItem(KEY, JSON.stringify(copy));
}
function save(){ saveLocal(); }

async function openBusiness(){
  if(session.role!=="dueno"){ alert("Solo el dueño puede abrir el negocio."); return; }
  const rec={id:uid(),openedAt:new Date().toISOString(),closedAt:null,by:"dueno"};
  db.sessions.unshift(rec);
  db.openSession=rec;
  saveLocal();
  if(!rtdb){
    alert("Firebase no está conectado. Revisa la configuración.");
    render();
    return;
  }
  try{
    await rtdb.ref("sessions/"+rec.id).set(rec);
    await rtdb.ref("business").set({open:true, sessionId:rec.id, openedAt:rec.openedAt, closedAt:null, by:"dueno"});
  }catch(e){
    console.warn(e);
    alert("No se pudo abrir en línea. En Firebase → Realtime Database → Reglas, publica lectura y escritura permitidas.");
  }
  render();
}
async function closeBusiness(){
  if(session.role!=="dueno"){ alert("Solo el dueño puede cerrar el negocio."); return; }
  const closedAt=new Date().toISOString();
  if(db.openSession){
    db.openSession.closedAt=closedAt;
    const i=db.sessions.findIndex(x=>x.id===db.openSession.id);
    if(i>=0) db.sessions[i]=Object.assign({}, db.openSession);
    const sid=db.openSession.id;
    db.openSession=null;
    saveLocal();
    if(rtdb){
      try{
        await rtdb.ref("sessions/"+sid+"/closedAt").set(closedAt);
        await rtdb.ref("business").set({open:false, closedAt:closedAt, sessionId:null});
      }catch(e){
        console.warn(e);
        alert("No se pudo cerrar en línea. Revisa las reglas de Firebase.");
      }
    }
  } else if(rtdb){
    try{
      await rtdb.ref("business").set({open:false, closedAt:closedAt, sessionId:null});
    }catch(e){ console.warn(e); }
  }
  render();
}

async function cloudSaveOrder(order){
  if(!rtdb){ db.orders.unshift(order); saveLocal(); return order; }
  await rtdb.ref("orders/"+order.id).set(JSON.parse(JSON.stringify(order)));
  if(order.n >= (db.seq||1)){ db.seq = order.n+1; saveLocal(); }
  return order;
}
async function cloudUpdateOrder(order){
  if(!rtdb){ saveLocal(); return; }
  await rtdb.ref("orders/"+order.id).set(JSON.parse(JSON.stringify(order)));
}
async function cloudDeleteSession(id){
  db.sessions = db.sessions.filter(s=>s.id!==id);
  saveLocal(); render();
}
async function cloudDeleteOrder(id){
  if(!rtdb){
    db.orders = db.orders.filter(o=>o.id!==id);
    saveLocal(); render(); return;
  }
  await rtdb.ref("orders/"+id).remove();
}
async function cloudSaveMenu(){
  saveLocal();
  if(!rtdb) return;
  try{
    await rtdb.ref("menu").set({
      categories: db.categories,
      products: db.products,
      mesas: db.mesas,
      updatedAt: new Date().toISOString()
    });
  }catch(e){ console.warn("menu save", e); }
}

let knownOrderIds = new Set();
let ordersReady = false;

function notifyNewOrder(o){
  if(session.role!=="dueno" && session.role!=="admin") return;
  const title = "Nuevo pedido #"+o.n;
  const body = (o.mesa||"")+" · "+(o.customer||"Cliente")+" · "+money(o.total||0);
  try{
    if(typeof Notification!=="undefined" && Notification.permission==="granted"){
      new Notification(title,{body:body, icon:"icon-192.png", tag:"order-"+o.id});
    }
  }catch(e){}
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value=880; gain.gain.value=0.08;
    osc.start(); setTimeout(()=>{ try{osc.stop(); ctx.close();}catch(e){} },220);
  }catch(e){}
}

function requestNotifyPermission(){
  try{
    if(typeof Notification!=="undefined" && Notification.permission==="default"){
      Notification.requestPermission();
    }
  }catch(e){}
}

let knownBillRequests = new Set();

function startCloudListeners(){
  if(!rtdb) return;
  rtdb.ref("business").on("value", snap=>{
    const d = snap.val()||{};
    db.openSession = d.open ? {id:d.sessionId||"cloud", openedAt:d.openedAt, closedAt:null, by:d.by} : null;
    if(session.role) render();
  }, err=>console.warn("business listener", err));
  rtdb.ref("orders").on("value", snap=>{
    const val = snap.val()||{};
    const list = Object.keys(val).map(k=>Object.assign({id:k}, val[k]))
      .sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    if(ordersReady){
      list.forEach(o=>{
        if(!knownOrderIds.has(o.id) && o.status!=="anulado"){
          notifyNewOrder(o);
        }
        if(o.cobroSolicitado && !o.paid && !knownBillRequests.has(o.id)){
          if(session.role==="dueno"||session.role==="admin"){
            try{
              if(typeof Notification!=="undefined" && Notification.permission==="granted"){
                new Notification("Cliente solicita cobro #"+o.n,{
                  body:(o.mesa||"")+" · "+(o.customer||"Cliente")+" · "+money(o.total||0),
                  icon:"icon-192.png", tag:"bill-"+o.id
                });
              }
            }catch(e){}
          }
        }
      });
    }
    knownOrderIds = new Set(list.map(o=>o.id));
    knownBillRequests = new Set(list.filter(o=>o.cobroSolicitado&&!o.paid).map(o=>o.id));
    ordersReady = true;
    db.orders = list;
    if(session.role) render();
  }, err=>console.warn("orders listener", err));
  rtdb.ref("menu").on("value", snap=>{
    const m=snap.val();
    if(!m) return;
    if(Array.isArray(m.categories) && m.categories.length) db.categories=m.categories;
    if(Array.isArray(m.products) && m.products.length) db.products=m.products;
    if(typeof m.mesas==="number") db.mesas=m.mesas;
    saveLocal();
    if(session.role && (ui.screen==="menu"||ui.screen==="productos")) render();
  }, err=>console.warn("menu listener", err));

const SESSION_KEY = "kibutz_session_role";
const THEME_KEY = "kibutz_theme";
function setCookie(name,val,days){
  try{
    const max=days?`;max-age=${days*86400}`:";max-age=0";
    document.cookie=name+"="+encodeURIComponent(val||"")+max+";path=/;SameSite=Lax";
  }catch(e){}
}
function getCookie(name){
  try{
    const m=document.cookie.match(new RegExp("(?:^|; )"+name+"=([^;]*)"));
    return m?decodeURIComponent(m[1]):null;
  }catch(e){ return null; }
}
function loadSessionRole(){
  try{
    const r = localStorage.getItem(SESSION_KEY) || getCookie(SESSION_KEY);
    if(r==="dueno") return "dueno";
    if(r==="admin") return "admin";
  }catch(e){}
  return null;
}
function saveSessionRole(role){
  try{
    if(role==="dueno" || role==="admin"){
      localStorage.setItem(SESSION_KEY, role);
      localStorage.setItem(STAFF_MODE_KEY,"1");
      setCookie(SESSION_KEY, role, 400);
      setCookie(STAFF_MODE_KEY, "1", 400);
    } else {
      localStorage.removeItem(SESSION_KEY);
      setCookie(SESSION_KEY, "", 0);
    }
  }catch(e){}
}
function applyTheme(theme){
  const t = theme==="dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t==="dark" ? "dark" : "");
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==="dark" ? "#12101a" : "#311256";
}
function loadTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    if(t==="dark") applyTheme("dark");
    else applyTheme("light");
  }catch(e){ applyTheme("light"); }
}

function bindSwipeDeletes(root){
  root.querySelectorAll(".swipe-wrap").forEach(wrap=>{
    const panel=wrap.querySelector(".swipe-panel");
    if(!panel) return;
    const hasEdit=!!wrap.querySelector(".act-edit");
    let startX=0, dx=0, dragging=false, locked=false;
    const maxL=-92, maxR=hasEdit?92:0;
    const onStart=e=>{
      const t=e.touches?e.touches[0]:e;
      startX=t.clientX; dx=0; dragging=true; locked=false;
      panel.style.transition="none";
      wrap.classList.remove("open-left","open-right");
    };
    const onMove=e=>{
      if(!dragging) return;
      const t=e.touches?e.touches[0]:e;
      const x=t.clientX-startX, y=(e.touches?e.touches[0]:e).clientY;
      if(!locked){
        if(Math.abs(x)>10) locked=true;
      }
      if(!locked) return;
      dx=Math.max(maxL, Math.min(maxR, x));
      panel.style.transform=`translateX(${dx}px)`;
      if(e.cancelable) e.preventDefault();
    };
    const onEnd=()=>{
      if(!dragging) return;
      dragging=false;
      panel.style.transition="transform .45s cubic-bezier(.22,1,.36,1)";
      if(dx<-40){ wrap.classList.add("open-left"); panel.style.transform="translateX(-92px)"; }
      else if(dx>40 && hasEdit){ wrap.classList.add("open-right"); panel.style.transform="translateX(92px)"; }
      else { wrap.classList.remove("open-left","open-right"); panel.style.transform="translateX(0)"; }
      dx=0;
    };
    panel.addEventListener("touchstart", onStart, {passive:true});
    panel.addEventListener("touchmove", onMove, {passive:false});
    panel.addEventListener("touchend", onEnd);
  });
}
function bindModalSwipeDown(back, modal, onClose){
  if(!modal) return;
  let startY=0, dy=0, dragging=false;
  const onStart=e=>{
    const t=e.touches?e.touches[0]:e;
    startY=t.clientY; dy=0; dragging=true;
    back.classList.add("drag-down");
  };
  const onMove=e=>{
    if(!dragging) return;
    const t=e.touches?e.touches[0]:e;
    dy=Math.max(0, t.clientY-startY);
    modal.style.transform=`translateY(${dy}px)`;
    if(e.cancelable) e.preventDefault();
  };
  const onEnd=()=>{
    if(!dragging) return;
    dragging=false;
    back.classList.remove("drag-down");
    if(dy>100){
      back.classList.add("closing");
      modal.style.transform="translateY(110%)";
      setTimeout(()=>onClose(), 280);
    } else {
      modal.style.transition="transform .4s cubic-bezier(.22,1,.36,1)";
      modal.style.transform="translateY(0)";
      setTimeout(()=>{ modal.style.transition=""; }, 400);
    }
    dy=0;
  };
  // Teléfono: solo deslizamiento (touch)
  modal.addEventListener("touchstart", onStart, {passive:true});
  modal.addEventListener("touchmove", onMove, {passive:false});
  modal.addEventListener("touchend", onEnd);
  // Computadora: clic afuera cierra (mouse / pointer fino). En móvil no aplica.
  const isDesktop = () => {
    try{ return window.matchMedia("(hover: hover) and (pointer: fine)").matches; }
    catch(e){ return !("ontouchstart" in window); }
  };
  back.addEventListener("click", e=>{
    if(e.target===back && isDesktop()) onClose();
  });
}

    const o=db.orders.find(x=>x.id===b.dataset.cancel);
    if(!o||!canClientCancel(o)) return;
    if(!confirm("¿Cancelar tu pedido #"+o.n+"?")) return;
    o.status="anulado";
    cloudUpdateOrder(o);
    alert("Pedido cancelado.");
    paintScreen();
  });
  el.querySelectorAll("[data-bill]").forEach(b=>b.onclick=()=>{
    const o=db.orders.find(x=>x.id===b.dataset.bill);
    if(!o||!canClientRequestBill(o)) return;
    o.cobroSolicitado=true;
    o.cobroSolicitadoAt=new Date().toISOString();
    cloudUpdateOrder(o);
    alert("Cobro solicitado. El personal te atenderá.");
    paintScreen();
  });
  el.querySelectorAll("[data-ticket]").forEach(b=>b.onclick=()=>{
    const o=db.orders.find(x=>x.id===b.dataset.ticket);

  });
  el.querySelectorAll("[data-delord]").forEach(b=>b.onclick=e=>{

  el.querySelectorAll("[data-editord]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    openClientOrderSheet(b.dataset.editord);
  });
  bindSwipeDeletes(el);
  $("#newOrderSheet").onclick=()=>openClientOrderSheet(null);
}

function makeOrder(partial){
  const order=Object.assign({
    id:uid(), n:db.seq++, createdAt:new Date().toISOString(),
    status:"en_espera", paid:false, pay:null, sessionId:db.openSession&&db.openSession.id,
    clientId:getClientId(), eta:null
  }, partial);
  order.total=order.items.reduce((a,l)=>a+l.qty*l.price,0);
  cloudSaveOrder(order);
  return order;
}

function isTodayOrder(o){
  if(!o||!o.createdAt) return false;
  const d=new Date(o.createdAt), n=new Date();
  return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
}
function purgeOldOrdersIfNeeded(){
  // Auto: pedidos cobrados/anulados de hace más de 30 días se eliminan de la nube
  const key="kibutz_last_purge_day";
  const day=todayISO();
  try{
    if(localStorage.getItem(key)===day) return;
    localStorage.setItem(key, day);
  }catch(e){}
  const limit=Date.now()-30*24*60*60*1000;
  (db.orders||[]).forEach(o=>{
    if(!o.paid && o.status!=="anulado") return;
    const t=new Date(o.pay&&o.pay.at||o.createdAt).getTime();
    if(t && t<limit) cloudDeleteOrder(o.id);
  });
}
function viewPedidos(el){
  purgeOldOrdersIfNeeded();
  const filters=[["todos","Todos"],["en_espera","En espera"],["preparacion","Preparación"],["listo","Listos"],["entregado","Entregados"],["cobrado","Cobrados"]];
  let list=db.orders.filter(o=>isTodayOrder(o) && (ui.orderFilter==="todos" || o.status===ui.orderFilter || (ui.orderFilter==="cobrado"&&o.paid)));
  el.innerHTML=`<h2>Pedidos de hoy</h2>
    <div class="tabs">${filters.map(([id,l])=>`<button data-f="${id}" class="${ui.orderFilter===id?"on":""}">${l}</button>`).join("")}</div>
    ${list.length?list.map(o=>orderRow(o)).join(""):`<p class="muted">Sin pedidos en este filtro.</p>`}
    <button class="btn danger block" id="purgeAllToday" style="margin-top:12px">Eliminar todos los de hoy</button>`;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ui.orderFilter=b.dataset.f; paintScreen();});
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{ui.detail=b.dataset.open; openOrderModal(b.dataset.open);});
  el.querySelectorAll("[data-delord]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(confirm("¿Eliminar este pedido?")) cloudDeleteOrder(b.dataset.delord);
  });
  $("#purgeAllToday").onclick=()=>{
    const all=db.orders.filter(o=>isTodayOrder(o));
    if(!all.length){ alert("No hay pedidos de hoy."); return; }
    if(!confirm("¿Eliminar TODOS los pedidos de hoy ("+all.length+")?")) return;
    all.forEach(o=>cloudDeleteOrder(o.id));
  };
  bindSwipeDeletes(el);
}

function statusLabel(o){ if(o.paid) return "Cobrado"; return ({en_espera:"En espera",preparacion:"Preparación",listo:"Listo",entregado:"Entregado",anulado:"Anulado"})[o.status]||o.status; }

    ${extras.length?`<div style="margin-top:8px;padding:10px;border-radius:12px;border:2px solid var(--cyan);background:rgba(0,180,216,.08)">
      <b style="color:var(--cyan)">Extra / actualización</b>
      ${extras.map((l,i)=>`<div class="row" style="gap:6px;margin:6px 0">
        <input data-eqty="${i}" data-kind="extra" type="number" min="0" value="${l.qty}" style="width:64px">
        <span style="flex:1">${esc(l.name)}</span>
        <span>${money(l.qty*l.price)}</span>
      </div>`).join("")}
    </div>`:""}
    </div>
    <div class="row"><b>Total</b><b class="price">${money(o.total)}</b></div>
    <label>Tiempo estimado (minutos)</label>
    <div class="row" style="gap:8px">
      <input id="etaMin" inputmode="numeric" placeholder="Ej. 15" value="${o.eta!=null?esc(String(o.eta)):""}" style="flex:1">

    </div>
    <button class="btn block" id="saveItems" style="margin-top:8px">Guardar cambios del pedido / ticket</button>
    <div class="grid2" style="margin-top:10px">
      <button class="btn ghost" data-st="preparacion">Preparación</button>
      <button class="btn ghost" data-st="listo">Listo</button>
      <button class="btn ghost" data-st="entregado">Entregado</button>
      ${canCharge?`<button class="btn ok" id="cobrar">Cobrar</button>`:`<button class="btn ghost" disabled title="Solo cuando el cliente solicita cobro">Cobrar</button>`}
    </div>
    ${o.paid?`<button class="btn ghost block" id="verTicket" style="margin-top:8px">Ver ticket / factura</button>`:`<p class="muted" style="margin-top:8px">El ticket/factura aparece después del cobro.</p>`}
  </div>`;
  document.body.appendChild(back);
  const modal=back.querySelector(".modal");
  const close=()=>{ ui.detail=null; back.remove(); };
  // Solo cierre por deslizamiento hacia abajo
  bindModalSwipeDown(back, modal, close);
  back.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{o.status=b.dataset.st; cloudUpdateOrder(o); close(); paintScreen();});
  const cob=$("#cobrar");
  if(cob) cob.onclick=()=>{ close(); openCobro(o); };
  const vt=$("#verTicket");
  if(vt) vt.onclick=()=>openDocs(o);
  $("#saveEta").onclick=()=>{
    const v=parseInt($("#etaMin").value,10);
    o.eta=isNaN(v)?null:v;
    cloudUpdateOrder(o);

  };

    o.tieneExtra=next.some(l=>l.isExtra);
    cloudUpdateOrder(o);
    alert("Pedido actualizado");
    close();
    paintScreen();
  };
}

    const r=Number($("#recibido").value)||0; const v=r-o.total;

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function rangeOf(tab){
  const now=new Date();
  const start=new Date(now); start.setHours(0,0,0,0);
  if(tab==="semana"){ const day=(start.getDay()+6)%7; start.setDate(start.getDate()-day); }
  if(tab==="mes") start.setDate(1);
  return start;
}
function ordersIn(tab){
  const start=rangeOf(tab).getTime();
  return db.orders.filter(o=>o.paid && new Date(o.pay.at).getTime()>=start && o.status!=="anulado");
}
function groupProducts(orders){
  const map={};
  orders.forEach(o=>o.items.forEach(l=>{
    if(!map[l.name]) map[l.name]={name:l.name,qty:0,total:0};
    map[l.name].qty+=l.qty; map[l.name].total+=l.qty*l.price;
  }));
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,"es"));
}
function cashOf(orders){
  const recibido=orders.reduce((a,o)=>a+(o.pay?o.pay.recibido:0),0);
  const vuelto=orders.reduce((a,o)=>a+(o.pay?o.pay.vuelto:0),0);
  const neto=orders.reduce((a,o)=>a+o.total,0);
  return {recibido,vuelto,neto};
}
function sessionsIn(tab){
  const start=rangeOf(tab).getTime();
  return db.sessions.filter(s=>new Date(s.openedAt).getTime()>=start);
}
function reportText(tab){
  const names={dia:"DIARIO",semana:"SEMANAL",mes:"MENSUAL"};
  const orders=ordersIn(tab); const g=groupProducts(orders); const c=cashOf(orders);
  const ses=sessionsIn(tab);
  let t=`KIBUTZ CAFETERÍA\nREPORTE ${names[tab]}\nGenerado: ${fmtDT(new Date().toISOString())}\n`;
  t+=`\nAPERTURA / CIERRE\n`;
  if(!ses.length) t+=`Sin registros en el periodo.\n`;
  ses.forEach(s=>{ t+=`Abrió: ${fmtDT(s.openedAt)}\nCerró: ${s.closedAt?fmtDT(s.closedAt):"Aún abierto"}\n`; });
  t+=`\nPEDIDOS COBRADOS: ${orders.length}\nTOTAL VENDIDO: ${money(c.neto)}\nEfectivo recibido: ${money(c.recibido)}\nVuelto: ${money(c.vuelto)}\nNeto: ${money(c.neto)}\n\nPRODUCTOS (cantidades sumadas)\n`;
  if(!g.length) t+=`Sin ventas.\n`;
  g.forEach(p=>{ t+=`${p.qty} x ${p.name} = ${money(p.total)}\n`; });
  return t;
}
function periodTabs(current, attr){
  return `<div class="tabs">`+["dia","semana","mes"].map(id=>`<button data-${attr}="${id}" class="${current===id?"on":""}">${id==="dia"?"Diario":id==="semana"?"Semanal":"Mensual"}</button>`).join("")+`</div>`;
}

      <div class="row"><span>Pedidos cobrados</span><b>${focusOrders.length}</b></div>
      <div class="row"><span>Total</span><b class="price">${money(focusOrders.reduce((a,o)=>a+o.total,0))}</b></div>
      ${focusOrders.map(o=>`<div class="row" style="margin-top:6px"><span>#${o.n} ${esc(o.customer||o.mesa||"")}</span><span>${money(o.total)}</span></div>`).join("")||"<p class='muted'>Sin ventas en este turno.</p>"}
      <button class="btn ghost block" id="clearSes" style="margin-top:8px">Cerrar detalle</button>
    </div>`:""}
    <h3>Desglose por producto</h3>
    <div class="card">${g.length?g.map(p=>`<div class="row"><span>${p.qty} × ${esc(p.name)}</span><b>${money(p.total)}</b></div>`).join(""):"<p class='muted'>Sin ventas.</p>"}</div>
    <button class="btn block" id="wa">Generar reporte para WhatsApp</button>
    <button class="btn ghost block" id="copy" style="margin-top:8px">Copiar reporte</button>`;
  el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab; ui.sessionFocus=null; paintScreen();});
  el.querySelectorAll("[data-ses]").forEach(b=>b.onclick=()=>{ui.sessionFocus=b.dataset.ses; paintScreen();});
  const cs=$("#clearSes"); if(cs) cs.onclick=()=>{ui.sessionFocus=null; paintScreen();};
  $("#wa").onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(reportText(ui.tab)),"_blank");
  $("#copy").onclick=()=>navigator.clipboard.writeText(reportText(ui.tab)).then(()=>alert("Copiado"));
}

function viewHistorial(el){
  purgeOldOrdersIfNeeded();
  const orders=ordersIn(ui.histTab).slice().sort((a,b)=>a.n-b.n);
  const ses=sessionsIn(ui.histTab);
  const g=groupProducts(orders);
  el.innerHTML=`<h2>Historial y ventas</h2>${periodTabs(ui.histTab,"htab")}
    <div class="card"><b>${money(orders.reduce((a,o)=>a+o.total,0))}</b><div class="muted">${orders.length} pedidos cobrados · se limpian solos a los 30 días</div></div>
    <h3>Aperturas y cierres</h3>
    <div class="card">${ses.length?ses.map(s=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>Abrió ${fmtDT(s.openedAt)}</b><br><span class="muted">Cerró ${s.closedAt?fmtDT(s.closedAt):"abierto"}</span></div>`).join(""):"<p class='muted'>Sin registros en este periodo.</p>"}</div>
    <h3>Desglose por producto</h3>
    <div class="card">${g.length?g.map(p=>`<div class="row"><span>${p.qty} × ${esc(p.name)}</span><b>${money(p.total)}</b></div>`).join(""):"<p class='muted'>Sin ventas.</p>"}</div>
    <h3>Pedidos</h3>
    ${orders.length?orders.map(o=>`<div class="swipe-wrap">
      <div class="swipe-actions"><button type="button" class="act act-del" data-delo="${o.id}">Eliminar</button></div>
      <div class="swipe-panel">
        <button data-open="${o.id}" style="width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:0">
          <div class="row"><b>#${o.n} ${esc(o.customer||o.mesa||"Cuenta")}</b><span class="price">${money(o.total)}</span></div>
          <div class="muted">${fmtDT(o.pay&&o.pay.at)} · ${(o.items||[]).reduce((a,l)=>a+l.qty,0)} ítems</div>
        </button>
      </div>
    </div>`).join(""):`<p class="muted">Sin pedidos cobrados en este periodo.</p>`}
    <div id="hdetail"></div>
    <button class="btn block" id="waH">Generar reporte WhatsApp</button>
    <button class="btn ghost block" id="copyH" style="margin-top:8px">Copiar reporte</button>`;
  el.querySelectorAll("[data-htab]").forEach(b=>b.onclick=()=>{ui.histTab=b.dataset.htab; ui.detail=null; paintScreen();});
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const o=db.orders.find(x=>x.id===b.dataset.open);
    if(!o||!o.paid) return;
    $("#hdetail").innerHTML=`<div class="card"><b>#${o.n} ${esc(o.customer||"Cuenta")}</b><p class="muted">${o.mesa} · ${fmtDT(o.pay&&o.pay.at)}</p>${o.items.map(l=>`<div class="row"><span>${l.qty} × ${esc(l.name)}</span><span>${money(l.qty*l.price)}</span></div>`).join("")}<div class="row"><b>Total</b><b>${money(o.total)}</b></div><button class="btn ghost" id="verFac">Ver / enviar ticket</button></div>`;
    $("#verFac").onclick=()=>openDocs(o);
  });
  el.querySelectorAll("[data-delo]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(confirm("¿Eliminar este pedido del historial?")) cloudDeleteOrder(b.dataset.delo);
  });
  bindSwipeDeletes(el);
  $("#waH").onclick=()=>window.open("https://wa.me/?text="+encodeURIComponent(reportText(ui.histTab)),"_blank");
  $("#copyH").onclick=()=>navigator.clipboard.writeText(reportText(ui.histTab)).then(()=>alert("Reporte copiado"));
}

function viewVenta(el){
  el.innerHTML=`<h2>Venta rápida</h2>${!db.openSession?`<div class="warn">Negocio cerrado. Registra la apertura antes de cobrar.</div>`:""}
    <div class="card">${ui.cart.map((l,i)=>`<div class="row"><span>${l.qty} × ${esc(l.name)}</span><span>${money(l.qty*l.price)}</span></div>`).join("")||"<p class='muted'>Agrega desde Menú.</p>"}
    <div class="row"><b>Total</b><b>${money(cartTotal())}</b></div></div>
    <label>Monto recibido</label><input id="vr" inputmode="decimal" value="${cartTotal().toFixed(2)}">
    <p>Vuelto <b id="vrv">$0.00</b></p>
    <button class="btn ok block" id="vrpay" ${!ui.cart.length||!db.openSession?"disabled":""}>Cobrar y registrar</button>`;
  const calc=()=>{ const r=Number($("#vr").value)||0; $("#vrv").textContent=money(Math.max(0,r-cartTotal())); };
  $("#vr").oninput=calc; calc();
  $("#vrpay").onclick=()=>{
    const recibido=Number($("#vr").value)||0;
    if(recibido+0.001<cartTotal()){ alert("Falta dinero"); return; }
    const order=makeOrder({customer:"Mostrador",mesa:"Venta rápida",note:"",items:ui.cart.map(x=>({...x})),channel:"rapida",status:"cobrado",paid:true,pay:{recibido,vuelto:recibido-cartTotal(),at:new Date().toISOString()}});
    ui.cart=[];
    openDocs(order);
    paintScreen();
  };
}

function viewProductos(el){
  el.innerHTML=`<h2>Productos</h2>
    <p class="muted">Los cambios se sincronizan en línea para admin y clientes.</p>
    <div class="card"><h3>Mesas</h3><input id="nmesas" type="number" min="1" max="40" value="${db.mesas}"><button class="btn" id="saveMesas" style="margin-top:8px">Guardar</button></div>
    <div class="card"><h3>Categorías</h3>
      <div class="row"><input id="newcat" placeholder="Nueva categoría"><button class="btn" id="addCat">+</button></div>
    </div>
    ${db.categories.map((c,i)=>`<div class="swipe-wrap">
      <div class="swipe-actions">
        <button type="button" class="act act-edit" data-editcat="${i}">Editar</button>
        <button type="button" class="act act-del" data-delcat="${i}">Eliminar</button>
      </div>
      <div class="swipe-panel"><b>${esc(c)}</b><div class="muted">${db.products.filter(p=>p.cat===c).length} productos</div></div>
    </div>`).join("")}
    <div class="card"><h3>Agregar producto</h3>
      <label>Categoría</label><select id="pcat">${db.categories.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
      <label>Nombre</label><input id="pname">
      <label>Precio ($)</label><input id="pprice" inputmode="decimal">
      <button class="btn block" id="addP" style="margin-top:8px">Agregar producto</button></div>
    ${db.categories.map(c=>`<h3>${esc(c)}</h3>${db.products.filter(p=>p.cat===c).map(p=>`<div class="swipe-wrap">
      <div class="swipe-actions">
        <button type="button" class="act act-edit" data-editp="${p.id}">Editar</button>
        <button type="button" class="act act-del" data-delp="${p.id}">Eliminar</button>
      </div>
      <div class="swipe-panel">
        <div class="row"><b>${esc(p.name)}</b><span class="price">${money(p.price)}</span></div>
        <div class="muted">${p.available?"Disponible":"Oculto"} · ${esc(p.cat)}</div>
      </div>
    </div>`).join("")||"<p class='muted'>Vacío</p>"}`).join("")}`;
  $("#saveMesas").onclick=()=>{db.mesas=Math.max(1,Number($("#nmesas").value)||8); cloudSaveMenu(); alert("Mesas actualizadas");};
  $("#addCat").onclick=()=>{const n=$("#newcat").value.trim(); if(n && !db.categories.includes(n)){db.categories.push(n); cloudSaveMenu(); paintScreen();}};
  el.querySelectorAll("[data-editcat]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.editcat;
    const old=db.categories[i];
    const back=document.createElement("div");
    back.className="modal-back";
    back.innerHTML=`<div class="modal">
      <h3 style="margin:0 0 6px">Editar categoría</h3>
      <label>Nombre</label><input id="ceName" value="${esc(old)}">
      <button class="btn block" id="ceSave" style="margin-top:12px;background:var(--cyan)">Guardar</button>
    </div>`;
    document.body.appendChild(back);
    const modal=back.querySelector(".modal");
    // Solo cierre por deslizamiento hacia abajo
    bindModalSwipeDown(back, modal, ()=>back.remove());
    $("#ceSave").onclick=()=>{
      const neu=$("#ceName").value.trim();
      if(!neu){ alert("Nombre vacío"); return; }
      if(neu!==old){
        db.categories[i]=neu;
        db.products.forEach(p=>{ if(p.cat===old) p.cat=neu; });
        cloudSaveMenu();
      }
      back.remove(); paintScreen();
    };
  });
  el.querySelectorAll("[data-delcat]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.delcat;
    const cat=db.categories[i];
    if(db.products.some(p=>p.cat===cat)){ alert("Quita o mueve los productos de esa categoría primero."); return; }
    if(!confirm("¿Eliminar categoría "+cat+"?")) return;
    db.categories.splice(i,1); cloudSaveMenu(); paintScreen();
  });
  $("#addP").onclick=()=>{
    const name=$("#pname").value.trim(); const price=Number($("#pprice").value);
    if(!name||!(price>=0)) return;
    db.products.push({id:uid(),cat:$("#pcat").value,name,price,available:true}); cloudSaveMenu(); paintScreen();
  };
  el.querySelectorAll("[data-delp]").forEach(b=>b.onclick=()=>{
    if(!confirm("¿Eliminar este producto?")) return;
    db.products=db.products.filter(p=>p.id!==b.dataset.delp);
    cloudSaveMenu(); paintScreen();
  });
  el.querySelectorAll("[data-editp]").forEach(b=>b.onclick=()=>openProductEditModal(b.dataset.editp));
  bindSwipeDeletes(el);
}
function openProductEditModal(pid){
  const p=db.products.find(x=>x.id===pid); if(!p) return;
  const back=document.createElement("div");
  back.className="modal-back";
  back.innerHTML=`<div class="modal">
    <h3 style="margin:0 0 6px">Editar producto</h3>
    <label>Nombre</label><input id="peName" value="${esc(p.name)}">
    <label>Precio ($)</label><input id="pePrice" inputmode="decimal" value="${p.price}">
    <label>Categoría</label><select id="peCat">${db.categories.map(c=>`<option ${c===p.cat?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <label style="margin-top:10px"><input type="checkbox" id="peAvail" ${p.available?"checked":""}> Disponible</label>
    <button class="btn block" id="peSave" style="margin-top:12px;background:var(--cyan)">Guardar cambios</button>
  </div>`;
  document.body.appendChild(back);
  const modal=back.querySelector(".modal");
  // Solo cierre por deslizamiento hacia abajo
  bindModalSwipeDown(back, modal, ()=>back.remove());
  $("#peSave").onclick=()=>{
    const name=$("#peName").value.trim();
    const price=Number($("#pePrice").value);
    if(!name||!(price>=0)){ alert("Datos inválidos"); return; }
    p.name=name; p.price=price; p.cat=$("#peCat").value; p.available=$("#peAvail").checked;
    cloudSaveMenu(); back.remove(); alert("Producto actualizado"); paintScreen();
  };
}

function viewHorario(el){
  const s=db.openSession;
  const isOwner = session.role==="dueno";
  el.innerHTML=`<h2>Apertura / Cierre</h2>
    <p class="muted"><b>Control global:</b> al abrir, todos los clientes (cualquier celular) pueden pedir. Al cerrar, nadie puede pedir.</p>
    ${s?`<div class="okbox">Negocio ABIERTO desde ${fmtDT(s.openedAt)} — clientes pueden pedir</div>`:`<div class="warn">Negocio CERRADO — los clientes no pueden pedir</div>`}
    ${!rtdb?`<div class="warn">Firebase no conectado. Sin eso el estado no se comparte entre dispositivos.</div>`:`<div class="okbox">Conectado en línea (Firebase)</div>`}
    ${isOwner?`
      <button class="btn ok block" id="abrir" ${s?"disabled":""}>Abrir negocio ahora</button>
      <button class="btn danger block" id="cerrar" style="margin-top:8px" ${s?"":"disabled"}>Cerrar negocio ahora</button>
    `:`<p class="muted">Solo el dueño puede abrir o cerrar el negocio.</p>`}
    <h3>Registros</h3>
    ${db.sessions.slice(0,40).map(x=>isOwner?`<div class="swipe-wrap">
      <div class="swipe-actions"><button type="button" class="act act-del" data-dels="${x.id}">Eliminar</button></div>
      <div class="swipe-panel">
        <b>${fmtDT(x.openedAt).slice(0,10)}</b>
        <div class="muted">Abrió: ${fmtDT(x.openedAt)}</div>
        <div class="muted">Cerró: ${x.closedAt?fmtDT(x.closedAt):"Abierto"}</div>
      </div>
    </div>`:`<div class="card" style="margin-bottom:8px"><b>${fmtDT(x.openedAt).slice(0,10)}</b><div class="muted">Abrió: ${fmtDT(x.openedAt)} · Cerró: ${x.closedAt?fmtDT(x.closedAt):"Abierto"}</div></div>`).join("")||"<p class='muted'>Aún no hay registros.</p>"}
    <p class="muted">Estos horarios salen en los reportes de WhatsApp (diario, semanal y mensual).</p>`;

    if(ab) ab.onclick=()=>openBusiness();
    if(ce) ce.onclick=()=>closeBusiness();
    el.querySelectorAll("[data-dels]").forEach(b=>b.onclick=()=>{
      if(confirm("¿Eliminar este registro?")) cloudDeleteSession(b.dataset.dels);

function viewDevices(el){
  const isOwner = session.role==="dueno";
  el.innerHTML=`<h2>Accesos</h2>
    ${isOwner ? `<div class="card">
      <h3>Contraseñas</h3>
      <label>Contraseña dueño</label><input id="pd" type="password" value="${esc(db.pins.dueno)}">
      <label>Contraseña admin / empleado</label><input id="pa" type="password" value="${esc(db.pins.admin)}">

    </div>
    <div class="card">
      <h3>Acceso de admin / empleado</h3>
      <p class="muted">Estado: <b>${db.adminApproved ? "Aprobado" : "No aprobado"}</b>${db.pendingAdmin ? " · hay solicitud pendiente" : ""}</p>

      <label>NIT</label><input id="enit" value="${esc(db.emitter.nit)}">
      <label>NRC</label><input id="enrc" value="${esc(db.emitter.nrc)}">
      <label>Actividad</label><input id="eac" value="${esc(db.emitter.actividad)}">
      <label>Dirección</label><input id="edir" value="${esc(db.emitter.direccion)}">
      <label>Teléfono</label><input id="etel" value="${esc(db.emitter.telefono)}">
      <label>Correo</label><input id="email" value="${esc(db.emitter.correo)}">
      <button class="btn" id="saveE" style="margin-top:8px">Guardar emisor</button>
      <p class="muted">La factura usa el logo y este encabezado. No es un DTE timbrado de Hacienda hasta que conectes un facturador autorizado.</p>
    </div>`;
  if(isOwner){
    $("#savePins").onclick=()=>{
      db.pins.dueno=$("#pd").value.trim()||"TaberKibbutzAdmin2026";
      db.pins.admin=$("#pa").value.trim()||"KibbutzTaber2026";
      save();
      alert("Contraseñas actualizadas");
    };
    const rev=$("#revokeAdmin");
    if(rev) rev.onclick=()=>{
      db.adminApproved=false;
      db.pendingAdmin=false;
      save();
      if(session.role==="admin"){
        session={role:null,name:""};
        saveSessionRole(null);
        render();
      } else {
        paintScreen();
      }
      alert("Acceso de admin revocado");
    };
  }
  $("#saveE").onclick=()=>{
    db.emitter={nombre:$("#en").value,nit:$("#enit").value,nrc:$("#enrc").value,actividad:$("#eac").value,direccion:$("#edir").value,telefono:$("#etel").value,correo:$("#email").value};
    save(); alert("Datos de factura guardados");
  };
}

function bindGate(){
  const go=role=>{ session.role=role; ui.screen="home"; ui.cart=[]; saveSessionRole(role); if(role==="dueno"||role==="admin") requestNotifyPermission(); render(); };
  const pinEl=$("#pin");
  const msg=$("#pinMsg");
  if(!pinEl) return;
  $("#asAdmin").onclick=()=>{
    const pass=pinEl.value.trim();
    if(pass!==db.pins.admin){
      msg.textContent="Contraseña incorrecta";
      return;
    }
    if(db.adminApproved){
      go("admin");
    } else {
      db.pendingAdmin=true;
      save();
      msg.textContent="Solicitud enviada al dueño. Espera a que acepte el acceso.";
    }
  };
  $("#asOwner").onclick=()=>{
    const pass=pinEl.value.trim();
    if(pass===db.pins.dueno) go("dueno");
    else msg.textContent="Contraseña incorrecta";
  };
}

window.addEventListener("storage", e=>{
  if(e.key===KEY){
    try{
      const x=JSON.parse(e.newValue||"{}");
      if(x&&x.products){
        db=Object.assign(seed(), x);
        render();
      }
    }catch(err){}
  }
});

render();
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-go]");
  if(b && b.closest(".bottomnav")){ ui.screen=b.dataset.go; ui.cat=null; render(); }
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
