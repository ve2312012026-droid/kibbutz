<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#311256">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KIBUTZ">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>KIBUTZ Cafetería</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1c2430; --muted:#6b7280;
  --purple:#311256; --purple2:#3d1a6e; --gold:#c9a04a; --cyan:#00b4d8;
  --line:#e6e8ee; --danger:#c0392b; --ok:#0f9d58; --shadow:0 8px 24px rgba(28,20,60,.08);
  --navh:64px; --topbar:#fff; --iconbg:#f2f3f7; --tabbg:#e9ebf0; --warnbg:#fff6e8; --warnink:#8a5a00;
  --okbg:#eefaf3; --okink:#0b7a43; --kpibg:#f7f5ff; --drawerbg:#fff; --drawerbtn:#f6f7fb;
}
[data-theme="dark"]{
  --bg:#12101a; --card:#1c1828; --ink:#eef0f5; --muted:#9aa0b0;
  --line:#2e2a3d; --shadow:0 8px 24px rgba(0,0,0,.35);
  --topbar:#1a1626; --iconbg:#2a2538; --tabbg:#2a2538; --warnbg:#3d2e12; --warnink:#f0c674;
  --okbg:#143528; --okink:#7ddea0; --kpibg:#241e38; --drawerbg:#1a1626; --drawerbtn:#2a2538;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--topbar);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.iconbtn{width:40px;height:40px;border:0;border-radius:12px;background:var(--iconbg);color:var(--ink)}
.brandmini{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--purple);flex-shrink:0}
.top-title{font-weight:800;letter-spacing:.04em;font-size:16px;line-height:1.15}
.top-sub{font-size:11px;color:var(--muted);line-height:1.2}
.pills{margin-left:auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.pill{font-size:11px;border-radius:999px;padding:2px 9px;background:#e8f7fb;color:#087a96}
[data-theme="dark"] .pill{background:#1a3340;color:#7dd3e8}
.pill.role{background:#efe7ff;color:#3b237c}
[data-theme="dark"] .pill.role{background:#2d2450;color:#c4b5fd}
.screen{flex:1;padding:14px 14px calc(var(--navh) + 18px)}
.hidden{display:none !important}

.home{min-height:calc(100vh - 70px);display:flex;align-items:center;justify-content:center;background:var(--purple);margin:-14px -14px calc(var(--navh) * -1);padding:24px}
.home img{width:min(92vw,420px);height:auto;display:block}
.home .fallback{text-align:center;color:#fff}
.home .fallback h1{font-size:48px;margin:8px 0 0;letter-spacing:.08em}
.home .fallback p{color:var(--gold);letter-spacing:.28em;margin:6px 0 0}

.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,86vw);background:var(--drawerbg);z-index:41;padding:18px 14px;overflow:auto;box-shadow:8px 0 30px rgba(0,0,0,.25);color:var(--ink)}
.drawer h3{margin:8px 8px 14px}
.drawer button{display:block;width:100%;text-align:left;border:0;background:var(--drawerbtn);border-radius:12px;padding:12px 12px;margin:0 0 8px;color:var(--ink)}
.drawer button.active{background:#efe7ff;color:var(--purple)}
[data-theme="dark"] .drawer button.active{background:#2d2450;color:#c4b5fd}

.bottomnav{position:fixed;left:0;right:0;bottom:0;height:var(--navh);background:var(--topbar);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1fr;z-index:30}
.bottomnav button{border:0;background:transparent;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bottomnav button.on{color:var(--purple);font-weight:700}
[data-theme="dark"] .bottomnav button.on{color:#c4b5fd}
.bottomnav svg{width:22px;height:22px}

h2{margin:4px 0 12px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:13px}
.price{color:var(--cyan);font-weight:800}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--purple);color:#fff}
.btn.gold{background:var(--gold);color:#2a2108}
.btn.ghost{background:var(--iconbg);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--ink)}
.cats{display:flex;flex-direction:column;gap:8px}
.catbtn{text-align:left;border:0;background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);font-weight:700;color:var(--ink)}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.plus{width:36px;height:36px;border-radius:50%;border:0;background:#2c3440;color:#fff;font-size:20px}
[data-theme="dark"] .plus{background:#4a4558}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.tabs button{border:0;background:var(--tabbg);border-radius:999px;padding:8px 12px;white-space:nowrap;color:var(--ink)}
.tabs button.on{background:var(--purple);color:#fff}
.listbtn{width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px;color:var(--ink)}
.badge{font-size:11px;border-radius:999px;padding:2px 8px;background:#eef6ff;color:var(--ink)}
[data-theme="dark"] .badge{background:#1a3340;color:#7dd3e8}
.modal-back{position:fixed;inset:0;background:rgba(17,12,32,.65);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);color:var(--ink);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.modal.wide{border-radius:12px;margin:12px;width:min(820px,calc(100% - 24px))}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--kpibg);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:18px}
.warn{background:var(--warnbg);color:var(--warnink);border-radius:12px;padding:10px;margin-bottom:10px}
.okbox{background:var(--okbg);color:var(--okink);border-radius:12px;padding:10px;margin-bottom:10px}

.invoice{background:#fff;color:#111;border:1px solid #d9d9d9;padding:16px;font-size:12px}
.invoice header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.invoice h1{font-size:13px;margin:0;letter-spacing:.04em}
.invoice table{width:100%;border-collapse:collapse;margin-top:10px}
.invoice th{background:#1f4e79;color:#fff;font-weight:600;padding:5px;font-size:10px}
.invoice td{border-bottom:1px solid #e5e5e5;padding:4px;vertical-align:top}
.invoice .box{border:1px solid #ccc;border-radius:6px;padding:8px;flex:1}
.invoice .tot{margin-left:auto;width:260px}
.invoice .tot td{border:1px solid #ddd}
.ticket{font-family:ui-monospace,monospace;background:#fff;padding:12px;width:280px;margin:0 auto;font-size:12px}
.ticket h3{text-align:center;margin:4px 0}
@media print{
  body *{visibility:hidden}
  #printRoot,#printRoot *{visibility:visible}
  #printRoot{position:absolute;left:0;top:0;width:100%}
  .no-print{display:none !important}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="printRoot" class="hidden"></div>

<script>
/* Firebase Realtime Database — ya configurado */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCAEEtimVy6r0ZAZgCSYEZngbhx2ydWNkc",
  authDomain: "kibbutz-78a5d.firebaseapp.com",
  databaseURL: "https://kibbutz-78a5d-default-rtdb.firebaseio.com",
  projectId: "kibbutz-78a5d",
  storageBucket: "kibbutz-78a5d.firebasestorage.app",
  messagingSenderId: "587833331807",
  appId: "1:587833331807:web:e1a356bfea80d7ac534bea",
  measurementId: "G-NNLMX56E9E"
};

const KEY="kibutz_pos_v3";
const isStaffMode = new URLSearchParams(window.location.search).has("admin");
const $ = (s,r=document)=>r.querySelector(s);
const money = n => "$"+(Number(n)||0).toFixed(2);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDT = d => d ? new Date(d).toLocaleString("es-SV",{dateStyle:"short",timeStyle:"short"}) : "—";
const UNITS=["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE"];
function enLetras(n){
  const v=Math.round(Number(n)*100)/100;
  const ent=Math.floor(v), dec=Math.round((v-ent)*100);
  const w = ent<=20 ? (UNITS[ent]||String(ent)) : String(ent);
  return `${w} DÓLARES CON ${String(dec).padStart(2,"0")}/100`;
}

const cloudEnabled = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
let rtdb = null;
if(cloudEnabled && typeof firebase !== "undefined"){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    rtdb = firebase.database();
  }catch(e){ console.warn("Firebase init", e); }
}

const seed = () => ({
  pins:{dueno:"TaberKibbutzAdmin2026", admin:"KibbutzTaber2026"},
  adminApproved: false,
  pendingAdmin: false,
  emitter:{
    nombre:"KIBUTZ CAFETERÍA",
    nit:"", nrc:"",
    actividad:"Servicio de cafetería y alimentos",
    direccion:"San Salvador, El Salvador",
    telefono:"", correo:""
  },
  mesas:8,
  categories:["Bebidas","Pupusas","Desayunos","Golosinas"],
  products:[
    {id:"p1",cat:"Bebidas",name:"Fresco Natural",price:1,available:true},
    {id:"p2",cat:"Bebidas",name:"Café",price:1.25,available:true},
    {id:"p3",cat:"Bebidas",name:"Té",price:1,available:true},
    {id:"p4",cat:"Bebidas",name:"Chocolate en polvo",price:1.5,available:true},
    {id:"p5",cat:"Bebidas",name:"Agua embotellada",price:0.75,available:true},
    {id:"p6",cat:"Bebidas",name:"Refresco",price:1,available:true}
  ],
  orders:[],
  sessions:[],
  openSession:null,
  seq:1
});

let db = loadLocal();
function loadLocal(){
  try{ const x=JSON.parse(localStorage.getItem(KEY)); if(x&&x.products) return Object.assign(seed(), x); }catch(e){}
  return seed();
}
function saveLocal(){
  const copy = Object.assign({}, db);
  if(rtdb){ copy.orders=[]; copy.sessions=[]; copy.openSession=null; }
  localStorage.setItem(KEY, JSON.stringify(copy));
}
function save(){ saveLocal(); }

async function cloudOpenBusiness(){
  if(!rtdb) return localOpenBusiness();
  const id = uid();
  const rec = {id, openedAt:new Date().toISOString(), closedAt:null, by:session.role||"dueno"};
  await rtdb.ref("sessions/"+id).set(rec);
  await rtdb.ref("business").set({
    open:true, sessionId:id, openedAt:rec.openedAt, closedAt:null, by:rec.by, seq: db.seq||1
  });
}
async function cloudCloseBusiness(){
  if(!rtdb) return localCloseBusiness();
  const snap = await rtdb.ref("business").once("value");
  const data = snap.val()||{};
  if(data.sessionId){
    await rtdb.ref("sessions/"+data.sessionId+"/closedAt").set(new Date().toISOString());
  }
  await rtdb.ref("business").update({
    open:false, closedAt:new Date().toISOString()
  });
}
function localOpenBusiness(){
  const rec={id:uid(),openedAt:new Date().toISOString(),closedAt:null,by:session.role};
  db.sessions.unshift(rec); db.openSession=rec; saveLocal(); render();
}
function localCloseBusiness(){
  if(!db.openSession) return;
  db.openSession.closedAt=new Date().toISOString();
  const i=db.sessions.findIndex(x=>x.id===db.openSession.id);
  if(i>=0) db.sessions[i]=db.openSession;
  db.openSession=null; saveLocal(); render();
}

async function cloudSaveOrder(order){
  if(!rtdb){ db.orders.unshift(order); saveLocal(); return order; }
  await rtdb.ref("orders/"+order.id).set(order);
  if(order.n >= (db.seq||1)){
    db.seq = order.n+1;
    await rtdb.ref("business/seq").set(db.seq);
  }
  return order;
}
async function cloudUpdateOrder(order){
  if(!rtdb){ saveLocal(); return; }
  await rtdb.ref("orders/"+order.id).set(order);
}
async function cloudDeleteSession(id){
  if(!rtdb){
    db.sessions = db.sessions.filter(s=>s.id!==id);
    saveLocal(); render(); return;
  }
  await rtdb.ref("sessions/"+id).remove();
}
async function cloudDeleteOrder(id){
  if(!rtdb){
    db.orders = db.orders.filter(o=>o.id!==id);
    saveLocal(); render(); return;
  }
  await rtdb.ref("orders/"+id).remove();
}

function startCloudListeners(){
  if(!rtdb) return;
  rtdb.ref("business").on("value", snap=>{
    const d = snap.val()||{};
    db.openSession = d.open ? {id:d.sessionId, openedAt:d.openedAt, closedAt:null, by:d.by} : null;
    if(typeof d.seq === "number") db.seq = d.seq;
    if(session.role) render();
  }, err=>console.warn(err));
  rtdb.ref("sessions").on("value", snap=>{
    const val = snap.val()||{};
    db.sessions = Object.keys(val).map(k=>Object.assign({id:k}, val[k]))
      .sort((a,b)=>(b.openedAt||"").localeCompare(a.openedAt||""));
    if(session.role && ui.screen==="horario") render();
  }, err=>console.warn(err));
  rtdb.ref("orders").on("value", snap=>{
    const val = snap.val()||{};
    db.orders = Object.keys(val).map(k=>Object.assign({id:k}, val[k]))
      .sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
    if(session.role && (ui.screen==="pedidos"||ui.screen==="historial"||ui.screen==="arqueo"||ui.screen==="pedido")) render();
  }, err=>console.warn(err));
}
startCloudListeners();

const SESSION_KEY = "kibutz_session_role";
const THEME_KEY = "kibutz_theme";
function loadSessionRole(){
  try{
    const r = localStorage.getItem(SESSION_KEY);
    if(r==="dueno") return "dueno";
    if(r==="admin" && db.adminApproved) return "admin";
  }catch(e){}
  return null;
}
function saveSessionRole(role){
  try{
    if(role==="dueno" || role==="admin") localStorage.setItem(SESSION_KEY, role);
    else localStorage.removeItem(SESSION_KEY);
  }catch(e){}
}
function applyTheme(theme){
  const t = theme==="dark" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t==="dark" ? "dark" : "");
  try{ localStorage.setItem(THEME_KEY, t); }catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = t==="dark" ? "#12101a" : "#311256";
}
function loadTheme(){
  try{
    const t = localStorage.getItem(THEME_KEY);
    if(t==="dark") applyTheme("dark");
    else applyTheme("light");
  }catch(e){ applyTheme("light"); }
}
loadTheme();

let session = {role:null, name:""};
let ui = {screen:"gate", cat:null, cart:[], tab:"dia", histTab:"dia", orderFilter:"todos", detail:null};

function logoHTML(cls=""){
  return `<img class="${cls}" src="logo-kibutz.jpg" alt="KIBUTZ" style="border-radius:0" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
  <div class="fallback" style="display:none"><div style="font-size:42px">☕</div><h1>KIBUTZ</h1><p>CAFETERÍA</p></div>`;
}

function render(){
  const app=$("#app");
  if(!session.role){
    if(!isStaffMode){
      session.role="cliente";
      ui.screen="home";
    } else {
      const saved = loadSessionRole();
      if(saved){
        session.role = saved;
        ui.screen = "home";
      } else {
        app.innerHTML = gate();
        bindGate();
        return;
      }
    }
  }
  const staff = session.role!=="cliente";
  const isDark = document.documentElement.getAttribute("data-theme")==="dark";
  app.innerHTML = `
    <div class="topbar no-print">
      ${staff ? `<button class="iconbtn" id="openMenu" aria-label="Menú">☰</button>` : `<button class="iconbtn" id="toggleThemeTop" aria-label="Tema">${isDark?"☀️":"🌙"}</button>`}
      <img class="brandmini" src="logo-kibutz.jpg" alt="KIBUTZ" onerror="this.style.visibility='hidden'">
      <div>
        <div class="top-title">KIBUTZ</div>
        <div class="top-sub">${new Date().toLocaleDateString("es-SV",{weekday:"long",day:"numeric",month:"long"})}</div>
      </div>
      <div class="pills">
        <span class="pill role">${labelRole(session.role)}</span>
        <span class="pill">${db.openSession?"Abierto":"Cerrado"}</span>
      </div>
    </div>
    ${session.role==="dueno" && db.pendingAdmin ? `<div class="warn no-print" style="margin:0;border-radius:0;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <span><b>Solicitud de acceso:</b> un empleado/admin pide entrar.</span>
      <span style="display:flex;gap:6px">
        <button class="btn ok" id="approveAdmin" style="padding:6px 12px">Aceptar</button>
        <button class="btn danger" id="rejectAdmin" style="padding:6px 12px">Rechazar</button>
      </span>
    </div>` : ""}
    <div class="screen" id="screen"></div>
    ${session.role==="cliente" ? bottomNav() : ""}
  `;
  paintScreen();
  const menuBtn = $("#openMenu");
  if(menuBtn) menuBtn.onclick=openDrawer;
  const themeTop = $("#toggleThemeTop");
  if(themeTop) themeTop.onclick=()=>{
    const next = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
    applyTheme(next);
    render();
  };
  if(session.role==="dueno" && db.pendingAdmin){
    const ap=$("#approveAdmin"), rj=$("#rejectAdmin");
    if(ap) ap.onclick=()=>{ db.adminApproved=true; db.pendingAdmin=false; save(); render(); };
    if(rj) rj.onclick=()=>{ db.pendingAdmin=false; save(); render(); };
  }
}

function labelRole(r){ return r==="dueno"?"Dueño":r==="admin"?"Admin":"Cliente"; }
function bottomNav(){
  const on=ui.screen;
  const b=(id,label,icon)=>`<button data-go="${id}" class="${on===id?"on":""}">${icon}<span>${label}</span></button>`;
  return `<nav class="bottomnav no-print">
    ${b("home","Inicio",icoHome())}
    ${b("menu","Menú",icoMenu())}
    ${b("pedido","Pedido",icoBag())}
  </nav>`;
}
const icoHome=()=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>`;
const icoMenu=()=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>`;
const icoBag=()=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/></svg>`;

function gate(){
  return `<div style="min-height:100vh;background:#311256;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center">
    <img src="logo-kibutz.jpg" alt="KIBUTZ" style="width:min(200px,55vw);height:auto;border-radius:0;display:block;margin:0 auto 8px" onerror="this.style.display='none'">
    <div class="card" style="width:min(340px,100%);margin-top:12px;border-radius:18px;padding:20px 18px;text-align:left;box-shadow:0 12px 40px rgba(0,0,0,.25)">
      <h3 style="margin:0 0 4px;font-size:18px">Acceso personal</h3>
      <p class="muted" style="margin:0 0 14px">Admin o dueño</p>
      <label style="margin-top:0">Contraseña</label>
      <input id="pin" placeholder="Escribe tu contraseña" type="password" autocomplete="current-password">
      <div class="grid2" style="margin-top:12px">
        <button class="btn ghost" id="asAdmin">Admin</button>
        <button class="btn gold" id="asOwner">Dueño</button>
      </div>
      <p class="muted" id="pinMsg" style="min-height:18px;margin:10px 0 0"></p>
      <p class="muted" style="margin:8px 0 0;font-size:12px">El acceso de admin requiere aprobación del dueño.</p>
    </div>
  </div>`;
}

function openDrawer(){
  const staff=session.role!=="cliente";
  const isDark = document.documentElement.getAttribute("data-theme")==="dark";
  const items = staff ? [
    ["home","Inicio"],["menu","Menú"],["pedidos","Pedidos"],["venta","Venta rápida"],
    ["arqueo","Arqueo / Ventas"],["productos","Productos"],["historial","Historial"],
    ["horario","Apertura / Cierre"],["dispositivos","Dispositivos"]
  ] : [["home","Inicio"],["menu","Menú"],["pedido","Mi pedido"]];
  const back=document.createElement("div");
  back.className="drawer-back";
  back.innerHTML=`<aside class="drawer"><h3>Secciones</h3>${items.map(([id,l])=>`<button data-go="${id}" class="${ui.screen===id?"active":""}">${l}</button>`).join("")}
    <button id="toggleTheme">${isDark?"Modo claro":"Modo oscuro"}</button>
    <button id="logout">Salir</button></aside>`;
  document.body.appendChild(back);
  back.addEventListener("click",e=>{
    if(e.target===back) back.remove();
    const go=e.target.dataset&&e.target.dataset.go;
    if(go){ ui.screen=go; ui.cat=null; back.remove(); render(); }
    if(e.target.id==="toggleTheme"){
      const next = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
      applyTheme(next);
      back.remove();
      render();
    }
    if(e.target.id==="logout"){ session={role:null,name:""}; saveSessionRole(null); back.remove(); render(); }
  });
}

function paintScreen(){
  const el=$("#screen");
  const map={home:viewHome,menu:viewMenu,pedido:viewPedido,pedidos:viewPedidos,venta:viewVenta,arqueo:viewArqueo,productos:viewProductos,historial:viewHistorial,horario:viewHorario,dispositivos:viewDevices};
  (map[ui.screen]||viewHome)(el);
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ui.screen=b.dataset.go; render();});
}

function viewHome(el){

}

function viewMenu(el){

function addCart(id){
  const p=db.products.find(x=>x.id===id); if(!p) return;
  const line=ui.cart.find(x=>x.id===id);
  if(line) line.qty++; else ui.cart.push({id,name:p.name,price:p.price,qty:1});
  paintScreen();
}
function cartCount(){return ui.cart.reduce((a,l)=>a+l.qty,0)}
function cartTotal(){return ui.cart.reduce((a,l)=>a+l.qty*l.price,0)}

function viewPedido(el){

function makeOrder(partial){
  const order=Object.assign({
    id:uid(), n:db.seq++, createdAt:new Date().toISOString(),
    status:"en_espera", paid:false, pay:null, sessionId:db.openSession&&db.openSession.id
  }, partial);
  order.total=order.items.reduce((a,l)=>a+l.qty*l.price,0);
  cloudSaveOrder(order);
  return order;
}

function viewPedidos(el){

function openCobro(o){
  const back=document.createElement("div");
  back.className="modal-back";
  back.innerHTML=`<div class="modal"><h3>Cobrar #${o.n}</h3><p>Total a pagar <b>${money(o.total)}</b></p>
    <label>Monto recibido</label><input id="recibido" inputmode="decimal" value="${o.total.toFixed(2)}">
    <p>Vuelto: <b id="vuelto">$0.00</b></p><p id="falta" class="warn hidden">Falta dinero</p>
    <div class="grid2"><button class="btn ok" id="okPay">Confirmar cobro</button><button class="btn ghost" id="noPay">Cancelar</button></div></div>`;
  document.body.appendChild(back);
  const calc=()=>{
    const r=Number($("#recibido").value)||0; const v=r-o.total;
    $("#vuelto").textContent=money(Math.max(0,v));
    $("#falta").classList.toggle("hidden", v>=-0.001);
    $("#okPay").disabled=v<-0.001;
  };
  $("#recibido").oninput=calc; calc();
  $("#noPay").onclick=()=>back.remove();
  $("#okPay").onclick=()=>{
    o.paid=true; o.status="cobrado";
    o.pay={recibido:Number($("#recibido").value)||0, vuelto:Math.max(0,(Number($("#recibido").value)||0)-o.total), at:new Date().toISOString()};
    cloudUpdateOrder(o); back.remove();
    openDocs(o);
    paintScreen();
  };
}

    <p class="okbox">Cobro registrado. Revisa el ticket y la factura antes de enviarlos.</p>

    </div></div>`;
  document.body.appendChild(back);
  let mode="ticket";
  const draw=()=>{ $("#doc").innerHTML = mode==="ticket"? ticketHTML(o): invoiceHTML(o); };
  draw();

    o.items.map((l,i)=>`${i+1}. ${l.qty} ${l.name} ${money(l.qty*l.price)}`).join("\n")+
    `\nTOTAL ${money(o.total)}\n${enLetras(o.total)}`;
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function rangeOf(tab){
  const now=new Date();
  const start=new Date(now); start.setHours(0,0,0,0);
  if(tab==="semana"){ const day=(start.getDay()+6)%7; start.setDate(start.getDate()-day); }
  if(tab==="mes") start.setDate(1);
  return start;
}
function ordersIn(tab){
  const start=rangeOf(tab).getTime();
  return db.orders.filter(o=>o.paid && new Date(o.pay.at).getTime()>=start && o.status!=="anulado");
}
function groupProducts(orders){
  const map={};
  orders.forEach(o=>o.items.forEach(l=>{
    if(!map[l.name]) map[l.name]={name:l.name,qty:0,total:0};
    map[l.name].qty+=l.qty; map[l.name].total+=l.qty*l.price;
  }));
  return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,"es"));
}
function cashOf(orders){
  const recibido=orders.reduce((a,o)=>a+(o.pay?o.pay.recibido:0),0);
  const vuelto=orders.reduce((a,o)=>a+(o.pay?o.pay.vuelto:0),0);
  const neto=orders.reduce((a,o)=>a+o.total,0);
  return {recibido,vuelto,neto};
}
function sessionsIn(tab){
  const start=rangeOf(tab).getTime();
  return db.sessions.filter(s=>new Date(s.openedAt).getTime()>=start);
}
function reportText(tab){
  const names={dia:"DIARIO",semana:"SEMANAL",mes:"MENSUAL"};
  const orders=ordersIn(tab); const g=groupProducts(orders); const c=cashOf(orders);
  const ses=sessionsIn(tab);
  let t=`KIBUTZ CAFETERÍA\nREPORTE ${names[tab]}\nGenerado: ${fmtDT(new Date().toISOString())}\n`;
  t+=`\nAPERTURA / CIERRE\n`;
  if(!ses.length) t+=`Sin registros en el periodo.\n`;
  ses.forEach(s=>{ t+=`Abrió: ${fmtDT(s.openedAt)}\nCerró: ${s.closedAt?fmtDT(s.closedAt):"Aún abierto"}\n`; });
  t+=`\nPEDIDOS COBRADOS: ${orders.length}\nTOTAL VENDIDO: ${money(c.neto)}\nEfectivo recibido: ${money(c.recibido)}\nVuelto: ${money(c.vuelto)}\nNeto: ${money(c.neto)}\n\nPRODUCTOS (cantidades sumadas)\n`;
  if(!g.length) t+=`Sin ventas.\n`;
  g.forEach(p=>{ t+=`${p.qty} x ${p.name} = ${money(p.total)}\n`; });
  return t;
}
function periodTabs(current, attr){
  return `<div class="tabs">`+["dia","semana","mes"].map(id=>`<button data-${attr}="${id}" class="${current===id?"on":""}">${id==="dia"?"Diario":id==="semana"?"Semanal":"Mensual"}</button>`).join("")+`</div>`;
}

function viewVenta(el){
  el.innerHTML=`<h2>Venta rápida</h2>${!db.openSession?`<div class="warn">Negocio cerrado. Registra la apertura antes de cobrar.</div>`:""}
    <div class="card">${ui.cart.map((l,i)=>`<div class="row"><span>${l.qty} × ${esc(l.name)}</span><span>${money(l.qty*l.price)}</span></div>`).join("")||"<p class='muted'>Agrega desde Menú.</p>"}
    <div class="row"><b>Total</b><b>${money(cartTotal())}</b></div></div>
    <label>Monto recibido</label><input id="vr" inputmode="decimal" value="${cartTotal().toFixed(2)}">
    <p>Vuelto <b id="vrv">$0.00</b></p>
    <button class="btn ok block" id="vrpay" ${!ui.cart.length||!db.openSession?"disabled":""}>Cobrar y registrar</button>`;
  const calc=()=>{ const r=Number($("#vr").value)||0; $("#vrv").textContent=money(Math.max(0,r-cartTotal())); };
  $("#vr").oninput=calc; calc();
  $("#vrpay").onclick=()=>{
    const recibido=Number($("#vr").value)||0;
    if(recibido+0.001<cartTotal()){ alert("Falta dinero"); return; }
    const order=makeOrder({customer:"Mostrador",mesa:"Venta rápida",note:"",items:ui.cart.map(x=>({...x})),channel:"rapida",status:"cobrado",paid:true,pay:{recibido,vuelto:recibido-cartTotal(),at:new Date().toISOString()}});
    ui.cart=[];
    openDocs(order);
    paintScreen();
  };
}

function viewProductos(el){
  el.innerHTML=`<h2>Productos</h2>
    <div class="card"><h3>Mesas</h3><input id="nmesas" type="number" min="1" max="40" value="${db.mesas}"><button class="btn" id="saveMesas" style="margin-top:8px">Guardar</button></div>
    <div class="card"><h3>Nueva categoría</h3><div class="row"><input id="newcat" placeholder="Nombre"><button class="btn" id="addCat">+</button></div>
      <p>${db.categories.map(c=>`<span class="badge">${esc(c)}</span> `).join("")}</p></div>
    <div class="card"><h3>Agregar producto</h3>
      <label>Categoría</label><select id="pcat">${db.categories.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
      <label>Nombre</label><input id="pname">
      <label>Precio ($)</label><input id="pprice" inputmode="decimal">
      <button class="btn block" id="addP" style="margin-top:8px">Agregar producto</button></div>
    ${db.categories.map(c=>`<h3>${esc(c)}</h3><div class="card">${db.products.filter(p=>p.cat===c).map(p=>`<div class="item"><div style="flex:1"><b>${esc(p.name)}</b><div class="muted">${money(p.price)} · ${p.available?"Disponible":"Agotado"}</div></div><button class="btn ghost" data-tog="${p.id}">${p.available?"Ocultar":"Activar"}</button></div>`).join("")||"<p class='muted'>Vacío</p>"}</div>`).join("")}`;
  $("#saveMesas").onclick=()=>{db.mesas=Math.max(1,Number($("#nmesas").value)||8); save(); alert("Mesas actualizadas");};
  $("#addCat").onclick=()=>{const n=$("#newcat").value.trim(); if(n && !db.categories.includes(n)){db.categories.push(n); save(); paintScreen();}};
  $("#addP").onclick=()=>{
    const name=$("#pname").value.trim(); const price=Number($("#pprice").value);
    if(!name||!(price>=0)) return;
    db.products.push({id:uid(),cat:$("#pcat").value,name,price,available:true}); save(); paintScreen();
  };
  el.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const p=db.products.find(x=>x.id===b.dataset.tog); p.available=!p.available; save(); paintScreen();});
}

function viewHorario(el){
  const s=db.openSession;
  const isOwner = session.role==="dueno";
  el.innerHTML=`<h2>Apertura / Cierre</h2>
    ${!rtdb?`<div class="warn">Modo local: configura Firebase para estado en línea.</div>`:`<div class="okbox">En línea: un solo estado para todos los dispositivos.</div>`}
    ${s?`<div class="okbox">Negocio abierto desde ${fmtDT(s.openedAt)}</div>`:`<div class="warn">Negocio cerrado. Los clientes no pueden pedir.</div>`}
    ${isOwner?`
      <button class="btn ok block" id="abrir" ${s?"disabled":""}>Abrir negocio ahora</button>
      <button class="btn danger block" id="cerrar" style="margin-top:8px" ${s?"":"disabled"}>Cerrar negocio ahora</button>
    `:`<p class="muted">Solo el dueño puede abrir o cerrar el negocio.</p>`}
    <h3>Registros</h3>
    <div class="card">${db.sessions.slice(0,40).map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start">
      <div style="flex:1"><b>${fmtDT(x.openedAt).slice(0,10)}</b><br>Abrió: ${fmtDT(x.openedAt)}<br>Cerró: ${x.closedAt?fmtDT(x.closedAt):"Abierto"}</div>
      ${isOwner?`<button class="btn danger" data-dels="${x.id}" style="padding:6px 10px">Eliminar</button>`:""}
    </div>`).join("")||"<p class='muted'>Aún no hay registros.</p>"}</div>
    <p class="muted">Estos horarios salen en los reportes de WhatsApp (diario, semanal y mensual).</p>`;
  if(isOwner){
    const ab=$("#abrir"), ce=$("#cerrar");
    if(ab) ab.onclick=()=>cloudOpenBusiness();
    if(ce) ce.onclick=()=>cloudCloseBusiness();
    el.querySelectorAll("[data-dels]").forEach(b=>b.onclick=()=>{
      if(confirm("¿Eliminar este registro de apertura/cierre?")) cloudDeleteSession(b.dataset.dels);
    });
  }
}

function viewDevices(el){
  const isOwner = session.role==="dueno";
  el.innerHTML=`<h2>Accesos</h2>
    ${isOwner ? `<div class="card">
      <h3>Contraseñas</h3>
      <label>Contraseña dueño</label><input id="pd" type="password" value="${esc(db.pins.dueno)}">
      <label>Contraseña admin / empleado</label><input id="pa" type="password" value="${esc(db.pins.admin)}">
      <button class="btn" id="savePins" style="margin-top:8px">Guardar contraseñas</button>
    </div>
    <div class="card">
      <h3>Acceso de admin / empleado</h3>
      <p class="muted">Estado: <b>${db.adminApproved ? "Aprobado" : "No aprobado"}</b>${db.pendingAdmin ? " · hay solicitud pendiente" : ""}</p>
      ${db.adminApproved ? `<button class="btn danger" id="revokeAdmin">Revocar acceso de admin</button>` : `<p class="muted">Cuando un admin pida acceso aparecerá el aviso arriba.</p>`}
    </div>` : `<div class="card"><p class="muted">Solo el dueño puede cambiar contraseñas y gestionar el acceso de admin.</p></div>`}
    <div class="card"><h3>Datos del emisor (factura)</h3>
      <label>Nombre</label><input id="en" value="${esc(db.emitter.nombre)}">
      <label>NIT</label><input id="enit" value="${esc(db.emitter.nit)}">
      <label>NRC</label><input id="enrc" value="${esc(db.emitter.nrc)}">
      <label>Actividad</label><input id="eac" value="${esc(db.emitter.actividad)}">
      <label>Dirección</label><input id="edir" value="${esc(db.emitter.direccion)}">
      <label>Teléfono</label><input id="etel" value="${esc(db.emitter.telefono)}">
      <label>Correo</label><input id="email" value="${esc(db.emitter.correo)}">
      <button class="btn" id="saveE" style="margin-top:8px">Guardar emisor</button>
      <p class="muted">La factura usa el logo y este encabezado. No es un DTE timbrado de Hacienda hasta que conectes un facturador autorizado.</p>
    </div>`;
  if(isOwner){
    $("#savePins").onclick=()=>{
      db.pins.dueno=$("#pd").value.trim()||"TaberKibbutzAdmin2026";
      db.pins.admin=$("#pa").value.trim()||"KibbutzTaber2026";
      save();
      alert("Contraseñas actualizadas");
    };
    const rev=$("#revokeAdmin");
    if(rev) rev.onclick=()=>{
      db.adminApproved=false;
      db.pendingAdmin=false;
      save();
      if(session.role==="admin"){
        session={role:null,name:""};
        saveSessionRole(null);
        render();
      } else {
        paintScreen();
      }
      alert("Acceso de admin revocado");
    };
  }
  $("#saveE").onclick=()=>{
    db.emitter={nombre:$("#en").value,nit:$("#enit").value,nrc:$("#enrc").value,actividad:$("#eac").value,direccion:$("#edir").value,telefono:$("#etel").value,correo:$("#email").value};
    save(); alert("Datos de factura guardados");
  };
}

function bindGate(){
  const go=role=>{ session.role=role; ui.screen="home"; ui.cart=[]; saveSessionRole(role); render(); };
  const pinEl=$("#pin");
  const msg=$("#pinMsg");
  if(!pinEl) return;
  $("#asAdmin").onclick=()=>{
    const pass=pinEl.value.trim();
    if(pass!==db.pins.admin){
      msg.textContent="Contraseña incorrecta";
      return;
    }
    if(db.adminApproved){
      go("admin");
    } else {
      db.pendingAdmin=true;
      save();
      msg.textContent="Solicitud enviada al dueño. Espera a que acepte el acceso.";
    }
  };
  $("#asOwner").onclick=()=>{
    const pass=pinEl.value.trim();
    if(pass===db.pins.dueno) go("dueno");
    else msg.textContent="Contraseña incorrecta";
  };
}

window.addEventListener("storage", e=>{
  if(e.key===KEY){
    try{
      const x=JSON.parse(e.newValue||"{}");
      if(x&&x.products){
        db=Object.assign(seed(), x);
        render();
      }
    }catch(err){}
  }
});

render();
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("[data-go]");
  if(b && b.closest(".bottomnav")){ ui.screen=b.dataset.go; ui.cat=null; render(); }
});

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
</body>
</html>
